events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HTTP Server - before Let's Encrypt is set up
    server {
        listen 80;
	server_name bike-access-check.uni-hamburg.de;

        auth_basic           "Kartierers Area";
        auth_basic_user_file /basic-auth-pw/htpasswd;

        # ACME Challenge for Let's Encrypt certificate validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS (comment out until SSL is ready)
        location / {
            return 301 https://$host$request_uri;
        }

    }

# HTTPS Server - uncomment and configure once Let's Encrypt certificates are set up
server {
    auth_basic           "Kartierers Area";
    auth_basic_user_file /basic-auth-pw/htpasswd;

    listen 443 ssl;
    server_name bike-access-check.uni-hamburg.de;

    # Let's Encrypt SSL Certificates (IT will provide the exact path)
    ssl_certificate /etc/letsencrypt/live/bike-access-check.uni-hamburg.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bike-access-check.uni-hamburg.de/privkey.pem;

    location /backend/ {
            proxy_pass http://backend:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /kartierung/ {
            proxy_pass http://frontend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /befragung/ {
            proxy_pass http://frontend:8080/befragung;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }        
        
        location /bike-shops/ {
            proxy_pass http://frontend:8080/bike-shops;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /formbricks/ {
            proxy_pass http://formbricks:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # for websocket support
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade";
        }


        location / {
            proxy_pass http://formbricks:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
