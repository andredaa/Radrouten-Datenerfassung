x-formbricks-environment: &formbricks-environment
  environment:
    # Formbricks Configuration
    WEBAPP_URL: https://bike-access-check.uni-hamburg.de
    NEXTAUTH_URL: https://bike-access-check.uni-hamburg.de
    DATABASE_URL: "postgresql://postgres:postgres@formbricks-postgres:5432/formbricks?schema=public"
    NEXTAUTH_SECRET: __generate_me__
    ENCRYPTION_KEY: __generate_me__
    CRON_SECRET: __generate_me__
    REDIS_URL: redis://redis:6379
    NODE_OPTIONS: "--dns-result-order=ipv4first"
    EMAIL_VERIFICATION_DISABLED: 1
    PASSWORD_RESET_DISABLED: 1

services:
  nginx:
    image: nginx:alpine
    ports:
      # Only nginx exposes ports to host
      - "80:80"      
      - "443:443"
    restart: always
    networks:
      - bac_kartierung_net
      - formbricks_net
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/certbot-temp:/var/www/certbot:ro
      - ./certbot/certbot-etc:/etc/letsencrypt:ro
      - ./basic-auth-pw:/basic-auth-pw:ro
    depends_on:
      - db
      - backend
      - frontend
      - formbricks

  db:
    image: postgis/postgis
    container_name: bac-karierung-db
    environment:
      POSTGRES_USER: ${POSTGIS_USER}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD}
      POSTGRES_DB: ${POSTGIS_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGIS_USER} -d ${POSTGIS_DB}"]
      interval: 10s
      retries: 5
      start_period: 40s
    restart: always
    networks:
      - bac_kartierung_net

  backend:
    build:
      dockerfile: python-backend/Dockerfile
    container_name: bac-kartierung-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGIS_USER: ${POSTGIS_USER}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD}
      POSTGIS_DB: ${POSTGIS_DB}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432 # Ensure backend connects to the internal DB port
      FORMBRICKS_API_KEY: ${FORMBRICKS_API_KEY}

    restart: always
    networks:
      - bac_kartierung_net

  frontend:
    build:
      dockerfile: frontend/Dockerfile
    container_name: kartierung-frontend
    depends_on:
      - backend
    restart: always
    networks:
      - bac_kartierung_net

  # Formbricks Services
  formbricks-postgres:
    restart: always
    image: pgvector/pgvector:pg17
    container_name: formbricks-postgres
    volumes:
      - formbricks_postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - formbricks_net

  redis:
    restart: always
    image: valkey/valkey@sha256:12ba4f45a7c3e1d0f076acd616cb230834e75a77e8516dde382720af32832d6d
    container_name: formbricks-redis
    command: valkey-server --appendonly yes
    volumes:
      - formbricks_redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - formbricks_net

  formbricks:
    restart: always
    image: ghcr.io/formbricks/formbricks:4.9.3
    container_name: formbricks
    depends_on:
      formbricks-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./formbricks-quickstart/saml-connection:/home/nextjs/apps/web/saml-connection
    networks:
      - formbricks_net
      - bac_kartierung_net
    <<: *formbricks-environment

networks:
  bac_kartierung_net:
  formbricks_net:

volumes:
  db_data:
  formbricks_postgres:
  formbricks_redis: