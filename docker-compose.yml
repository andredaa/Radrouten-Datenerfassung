services:
# TODO add ngnix service. no longer use "ports" on the other services then!
  db:
    image: postgis/postgis
    container_name: bac-karierung-db
    environment:
      POSTGRES_USER: ${POSTGIS_USER}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD}
      POSTGRES_DB: ${POSTGIS_DB}
    ports:
      - "${DB_PORT}:5432" # Map host port to container port
    volumes:
      - ./db_data:/var/lib/postgresql/data  # Bind mount to local folder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGIS_USER} -d ${POSTGIS_DB}"]
      interval: 10s
      retries: 5
      start_period: 40s
    restart: always
    networks:
      - bac_kartierung_net

  backend:
    build:
      context: .
      dockerfile: python-backend/Dockerfile
    container_name: bac-kartierung-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:5000" # Map host port to container port
    environment:
      POSTGIS_USER: ${POSTGIS_USER}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD}
      POSTGIS_DB: ${POSTGIS_DB}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432 # Ensure backend connects to the internal DB port

    restart: always
    networks:
      - bac_kartierung_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: kartierung-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"  # Map host port to container port
    restart: always
    networks:
      - bac_kartierung_net

networks:
  bac_kartierung_net:
