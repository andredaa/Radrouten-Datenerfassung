<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAC Befragung Standorte</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    #map canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Style switcher */
    .style-switcher {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      padding: 0.5rem;
      display: flex;
      gap: 0.5rem;
      z-index: 50;
    }

    .style-btn {
      padding: 0.5rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      background: #f3f4f6;
      color: #374151;
    }

    .style-btn.active {
      background: #3b82f6;
      color: white;
    }

    .style-btn:hover:not(.active) {
      background: #e5e7eb;
    }

    /* Burger menu button */
    .menu-toggle {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      padding: 0.75rem;
      border: none;
      cursor: pointer;
      z-index: 50;
    }

    .menu-toggle svg {
      height: 1.5rem;
      width: 1.5rem;
      color: #374151;
    }

    /* Download button */
    .download-btn {
      position: absolute;
      top: 4.5rem;
      left: 1rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      padding: 0.75rem;
      border: none;
      cursor: pointer;
      z-index: 50;
      transition: all 0.2s;
    }

    .download-btn:hover {
      background: #f3f4f6;
    }

    .download-btn svg {
      height: 1.5rem;
      width: 1.5rem;
      color: #374151;
    }

    /* Stopwatch button */
    .stopwatch-btn {
      padding: 0.5rem 1.5rem;
      background: white;
      border: 1px solid #d1d5db;
      color: #374151;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      min-width: 7rem;
      text-align: center;
      font-family: monospace;
      font-size: 1.125rem;
      margin-right: auto;
    }

    .stopwatch-btn:hover {
      background: #f3f4f6;
    }

    .stopwatch-btn.running {
      background: #dbeafe;
      color: #1e40af;
      border-color: #3b82f6;
    }

    /* Menu panel */
    .menu-panel {
      position: absolute;
      top: 1rem;
      left: 5rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 1.5rem;
      width: min(20rem, calc(100vw - 8rem));
      max-width: 20rem;
      z-index: 50;
      display: none;
    }

    .menu-panel.open {
      display: block;
    }

    .menu-panel h2 {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #1f2937;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.5rem;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      outline: none;
      font-size: 1rem;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .load-btn {
      width: 100%;
      background: #3b82f6;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      margin-top: 10px;
    }

    .load-btn:hover:not(:disabled) {
      background: #2563eb;
    }

    .load-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    /* Survey Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: white;
      border: 2px solid #9ca3af;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      border-radius: 0.5rem;
      width: 90vw;
      height: 90vh;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #d1d5db;
      background: #f3f4f6;
      border-radius: 0.5rem 0.5rem 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .modal-header h6 {
      font-size: 1.25rem;
      font-weight: bold;
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      color: #4b5563;
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
      padding: 0;
      width: 1.5rem;
      height: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #1f2937;
    }

    .modal-body {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #d1d5db;
      background: #f9fafb;
      border-radius: 0 0 0.5rem 0.5rem;
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .modal-footer button {
      padding: 0.5rem 1.5rem;
      background: #3b82f6;
      color: white;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .modal-footer button:hover {
      background: #2563eb;
    }

    /* Confirmation Dialog */
    .dialog-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .dialog-overlay.show {
      display: flex;
      opacity: 1;
    }

    .dialog-content {
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 1.5rem;
      max-width: 400px;
      width: 90vw;
    }

    .dialog-title {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #1f2937;
    }

    .dialog-message {
      margin-bottom: 1.5rem;
      color: #4b5563;
    }

    .dialog-buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .dialog-btn {
      padding: 0.5rem 1.5rem;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .dialog-btn.primary {
      background: #3b82f6;
      color: white;
    }

    .dialog-btn.primary:hover {
      background: #2563eb;
    }

    .dialog-btn.secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .dialog-btn.secondary:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
  <!-- Map container -->
  <div id="map"></div>

  <!-- Style switcher -->
  <div class="style-switcher">
    <button class="style-btn active" data-style="light">Light</button>
    <button class="style-btn" data-style="dark">Dark</button>
    <button class="style-btn" data-style="osm">OSM</button>
    <button class="style-btn" data-style="satellite">Satellite</button>
  </div>

  <!-- Burger menu button -->
  <button class="menu-toggle" id="menuToggle">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Menu panel -->
  <div class="menu-panel" id="menuPanel">
    <h2>Survey Locations</h2>
  
    
    <div class="form-group">
      <label for="locationSelect">Location (Stadtteil)</label>
      <select id="locationSelect">
        <!-- Options will be populated by JavaScript -->
      </select>
    </div>
    
  </div>
  </div>

  <!-- Confirmation Dialog -->
  <div class="dialog-overlay" id="confirmDialog">
    <div class="dialog-content" onclick="event.stopPropagation()">
      <div class="dialog-title">Start Survey</div>
      <div class="dialog-message" id="dialogMessage">Segment kartieren?</div>
      <div class="dialog-buttons">
        <button class="dialog-btn secondary" id="dialogCancel">Abbrechen</button>
        <button class="dialog-btn secondary" id="dialogRemove" style="display: none; background: #ef4444; color: white;">Kartierung für dieses Segment löschen</button>
        <button class="dialog-btn primary" id="dialogSurvey">Jetzt kartieren</button>
      </div>
    </div>
  </div>

  <!-- Survey Modal -->
  <div class="modal-overlay" id="surveyModal">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h6 id="modalTitle">Survey</h6>

        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <iframe id="surveyIframe" frameborder="0"></iframe>
      </div>
      <div class="modal-footer">
        <button class="stopwatch-btn" id="stopwatchBtn" title="Click to start/stop, double-click to reset">
          00:00
        </button>
        <button id="closeModalFooter">Close</button>
      </div>
    </div>
  </div>

  <script src="../stopwatch.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
