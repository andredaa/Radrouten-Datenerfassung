<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Shops Hamburg</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    #map canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Style switcher */
    .style-switcher {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      padding: 0.5rem;
      display: flex;
      gap: 0.5rem;
      z-index: 50;
    }

    .style-btn {
      padding: 0.5rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      background: #f3f4f6;
      color: #374151;
    }

    .style-btn.active {
      background: #3b82f6;
      color: white;
    }

    .style-btn:hover:not(.active) {
      background: #e5e7eb;
    }

    /* Info Panel */
    .info-panel {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .info-panel.show {
      display: flex;
      opacity: 1;
    }

    .info-content {
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 1.5rem;
      max-width: 500px;
      width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
    }

    .info-title {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #1f2937;
    }

    .info-properties {
      margin-bottom: 1.5rem;
    }

    .property-row {
      display: flex;
      padding: 0.5rem 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .property-row:last-child {
      border-bottom: none;
    }

    .property-key {
      font-weight: 600;
      color: #374151;
      min-width: 150px;
      flex-shrink: 0;
    }

    .property-value {
      color: #4b5563;
      word-break: break-word;
    }

    .info-buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .info-btn {
      padding: 0.5rem 1.5rem;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
      background: #3b82f6;
      color: white;
    }

    .info-btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <!-- Map container -->
  <div id="map"></div>

  <!-- Style switcher -->
  <div class="style-switcher">
    <button class="style-btn active" data-style="light">Light</button>
    <button class="style-btn" data-style="dark">Dark</button>
    <button class="style-btn" data-style="osm">OSM</button>
    <button class="style-btn" data-style="satellite">Satellite</button>
  </div>

  <!-- Info Panel -->
  <div class="info-panel" id="infoPanel">
    <div class="info-content" onclick="event.stopPropagation()">
      <div class="info-title">Bike Shop Details</div>
      <div class="info-properties" id="infoProperties">
        <!-- Properties will be populated by JavaScript -->
      </div>
      <div class="info-buttons">
        <button class="info-btn" id="closeInfo">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
